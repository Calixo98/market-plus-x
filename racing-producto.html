      <img src="assets/logo-wordmark.png" alt="Market Plus X" class="h-7 w-auto" />

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => '$' + Number(n).toLocaleString('es-CO');
    function inyectarJsonLd(p, precio, disponible) {
      const data = {
        '@context': 'https://schema.org',
        '@type': 'Product',
        name: p.nombre,
        sku: p.sku,
        description: p.diferenciador,
        brand: { '@type': 'Brand', name: 'Marketplus Racing' },
        image: [p.imagenes.hero, ...p.imagenes.galeria].map(u => new URL(u, location.href).href),
        offers: {
          '@type': 'Offer',
          price: precio,
          priceCurrency: 'COP',
          availability: disponible ? 'https://schema.org/InStock' : 'https://schema.org/SoldOut',
          url: location.href,
        },
      };
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.appendChild(script);
    }

    let RC, PRODUCTOS, STOCK, REVIEWS = { general: [], bySku: {} };

    async function cargar() {
      const params = new URLSearchParams(location.search);
      const sku = params.get('sku');
      const [rc, productos, stockResp, reviews] = await Promise.all([
        fetch('rc-crawlers.json').then(r => r.json()),
        fetch('productos.json').then(r => r.json()),
        fetch('api/stock').then(r => r.json()).catch(() => ({ stock: {} })),
        fetch('rc-reviews.json').then(r => r.json()).catch(() => ({ general: [], bySku: {} })),
      ]);
      RC = rc; PRODUCTOS = productos; STOCK = stockResp.stock || {};
      REVIEWS = {
        general: Array.isArray(reviews?.general) ? reviews.general : [],
        bySku: reviews?.bySku && typeof reviews.bySku === 'object' ? reviews.bySku : {},
      };

      const p = RC.productos.find(x => x.sku === sku);
      if (!p) { location.replace('racing.html'); return; }
      pintar(p);
    }

    function precioDe(sku) {
      const row = PRODUCTOS.productos.find(x => x.sku === sku);
      return row ? row.precio : null;
    }

    function reviewsPara(p) {
      const especificas = Array.isArray(REVIEWS.bySku?.[p.sku]) ? REVIEWS.bySku[p.sku] : [];
      return [...especificas, ...REVIEWS.general];
    }

    function estrellasHTML(puntuacion) {
      const valor = Math.min(5, Math.max(0, Number(puntuacion) || 0));
      return Array.from({ length: 5 }, (_, i) => `<i class="fa-solid fa-star text-[11px]" style="color:${i < valor ? '#C8F02A' : 'rgba(242,241,236,.2)'}" aria-hidden="true"></i>`).join('');
    }

    function reviewCardHTML(review) {
      const media = review.video
        ? `<video class="mt-4 w-full max-h-[360px] rounded-sm bg-black object-contain" controls playsinline preload="metadata" poster="${esc(review.poster || '')}" aria-label="Video compartido por ${esc(review.nombre)}"><source src="${esc(review.video)}" type="video/mp4" />Tu navegador no puede reproducir este video.</video>`
        : review.imagen
          ? `<img class="mt-4 w-full max-h-[360px] rounded-sm object-cover" src="${esc(review.imagen)}" alt="Experiencia compartida por ${esc(review.nombre)}" loading="lazy" />`
          : '';
      const alcance = review.alcance === 'general'
        ? `<p class="mt-3 text-[11px] leading-relaxed" style="color:rgba(242,241,236,.46);">Testimonio general de una compra real. No se atribuye a un SKU específico.</p>`
        : '';
      return `
        <article class="bento p-5 min-w-[min(86vw,380px)] sm:min-w-[360px] snap-start">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="flex gap-1" aria-label="${esc(review.puntuacion || 0)} de 5 estrellas">${estrellasHTML(review.puntuacion)}</div>
              <h3 class="mt-3 font-display font-bold text-lg">${esc(review.nombre || 'Cliente MK Racing')}</h3>
              <p class="mt-1 text-xs font-mono" style="color:rgba(242,241,236,.52);">${esc(review.etiqueta || 'Cliente MK Racing')}</p>
            </div>
            ${review.verificada ? '<span class="inline-flex items-center gap-1 text-[10px] font-mono font-semibold text-accent"><i class="fa-solid fa-circle-check"></i> Verificado</span>' : ''}
          </div>
          <p class="mt-4 text-sm leading-relaxed" style="color:rgba(242,241,236,.72);">${esc(review.texto || '')}</p>
          ${alcance}
          ${media}
        </article>`;
    }

    function reviewsHTML(p) {
      const reviews = reviewsPara(p);
      return `
        <section id="reseñas" class="mt-14 pt-10 border-t" style="border-color:rgba(242,241,236,.14);" aria-labelledby="reviewsTitle">
          <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
            <div>
              <p class="text-xs font-mono uppercase tracking-[.16em] text-accent">Prueba social</p>
              <h2 id="reviewsTitle" class="mt-2 text-2xl sm:text-3xl font-extrabold font-display">Testimonios reales</h2>
            </div>
            <p class="max-w-md text-xs leading-relaxed" style="color:rgba(242,241,236,.54);">Experiencias compartidas por clientes de MK Racing. Desliza en móvil o baja para ver cada testimonio.</p>
          </div>
          ${reviews.length
            ? `<div class="reviews-rail mt-6 flex gap-4 overflow-x-auto snap-x snap-mandatory pb-3" tabindex="0" aria-label="Testimonios de clientes">${reviews.map(reviewCardHTML).join('')}</div>`
            : `<div class="mt-6 bento p-6"><p class="text-sm" style="color:rgba(242,241,236,.68);">Estamos recopilando más reseñas reales de esta unidad.</p><button type="button" data-open-chat data-chat-prompt="María Paula, quiero compartir mi experiencia con este carrito." class="mt-4 inline-flex items-center gap-2 text-sm font-mono font-semibold text-accent hover:text-accent-hover"><i class="fa-regular fa-comments"></i> Compartir experiencia</button></div>`}
        </section>`;
    }

    function pintar(p) {
      const esVendidoOMostrador = p.estado !== 'disponible';
      const precio = esVendidoOMostrador ? p.precio_historico : precioDe(p.sku);
      const stock = STOCK[p.sku];
      const agotado = !esVendidoOMostrador && stock === 0;

      document.title = `${p.nombre} | MK Racing | Market Plus X`;
      document.getElementById('pageTitle').textContent = document.title;

      // Variante de color (solo el grupo Beige/Gris la usa)
      let variantesHTML = '';
      if (p.grupo_variantes) {
        const hermanos = RC.productos.filter(x => x.grupo_variantes === p.grupo_variantes);
        variantesHTML = `
          <div role="radiogroup" aria-label="Color" class="mt-4 flex items-center gap-2">
            <span class="text-xs font-mono" style="color:rgba(242,241,236,.5);" aria-hidden="true">Color:</span>
            ${hermanos.map(h => `
              <button type="button" role="radio" aria-checked="${h.sku === p.sku}" title="${esc(h.color)}"
                      data-variante-sku="${esc(h.sku)}"
                      class="px-3 py-1.5 rounded-full border text-xs font-mono transition"
                      style="${h.sku === p.sku ? 'border-color:#C9793C;color:#E0A868;' : 'border-color:rgba(242,241,236,.2);color:rgba(242,241,236,.6);'}">
                ${esc(h.color)}
              </button>`).join('')}
          </div>`;
      }

      const specsHTML = Object.entries(p.specs).map(([k, v]) => `
        <div class="grid grid-cols-[minmax(120px,.8fr)_1.2fr] gap-4 py-3 border-t" style="border-color:rgba(242,241,236,.12); font-size:12.5px;">
          <span style="color:rgba(242,241,236,.55);">${esc(k)}</span>
          <span class="text-ink">${esc(v)}</span>
        </div>`).join('');

      const claimsHTML = (p.claims_fabricante || []).length ? `
        <div class="mt-6 bento p-5">
          <p class="text-xs font-mono uppercase tracking-wide mb-3" style="color:#E0A868;">Según el fabricante</p>
          ${p.claims_fabricante.map(c => `
            <p class="flex items-start gap-2 text-xs mb-2" style="color:rgba(242,241,236,.6);"><i class="fa-solid ${esc(c.icono)} mt-0.5"></i> ${esc(c.texto)}</p>`).join('')}
        </div>` : '';

      const incluyeHTML = (p.incluye || []).length ? `
        <div class="mt-6">
          <p class="text-xs font-mono uppercase tracking-wide mb-3" style="color:rgba(242,241,236,.5);">Incluye en la caja</p>
          <div class="grid grid-cols-2 gap-2 text-sm" style="color:rgba(242,241,236,.7);">
            ${p.incluye.map(i => `<span class="flex items-center gap-2"><i class="fa-solid fa-check" style="color:#C9793C;"></i> ${esc(i)}</span>`).join('')}
          </div>
        </div>` : '';

      const relacionados = RC.productos
        .filter(x => x.estado === 'disponible' && x.familia === p.familia && x.sku !== p.sku && x.variante_primaria !== false)
        .sort((a, b) => a.orden - b.orden);
      const relacionadosHTML = relacionados.length ? `
        <div class="mt-12 pt-8 border-t" style="border-color:rgba(242,241,236,.14);">
          <p class="text-xs font-mono uppercase tracking-wide mb-4" style="color:rgba(242,241,236,.5);">Más de ${esc((RC.familias.find(f=>f.id===p.familia)||{}).nombre || 'esta familia')}</p>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
            ${relacionados.map(r => `
              <a href="racing-producto?sku=${encodeURIComponent(r.sku)}" class="bento p-3 hover:border-white/30 transition" style="border-color:rgba(242,241,236,.14);">
                <div class="aspect-square rounded-sm overflow-hidden mb-2" style="background:rgba(242,241,236,.03);">
                  <img src="${esc(r.imagenes.card)}" alt="${esc(r.nombre)}" loading="lazy" class="w-full h-full object-cover" />
                </div>
                <p class="text-xs font-mono font-semibold text-ink line-clamp-2">${esc(r.nombre)}</p>
                <p class="mt-1 text-sm font-bold font-display text-ink">${fmt(precioDe(r.sku))}</p>
              </a>`).join('')}
          </div>
        </div>` : '';

      const galeriaImgs = [p.imagenes.hero, ...p.imagenes.galeria];
      const thumbsHTML = galeriaImgs.map((src, i) => `
        <button type="button" class="thumb aspect-square rounded-sm overflow-hidden border ${i === 0 ? 'thumb-active' : ''}" data-src="${esc(src)}" style="border-color:rgba(242,241,236,.14);" aria-label="Ver foto ${i+1}">
          <img src="${esc(src)}" alt="" loading="lazy" class="w-full h-full object-cover" />
        </button>`).join('');

      let ctaHTML;
      if (esVendidoOMostrador) {
        ctaHTML = p.estado === 'vendido'
          ? `<button type="button" data-open-chat data-chat-prompt="María Paula, avísame si vuelve un modelo similar a ${esc(p.nombre)} (${esc(p.sku)})." class="btn-sharp w-full inline-flex items-center justify-center gap-2 border px-6 py-4 text-sm font-mono font-bold" style="border-color:rgba(242,241,236,.3); color:#F2F1EC;">Consultar disponibilidad</button>`
          : `<p class="text-sm font-mono" style="color:rgba(242,241,236,.5);">Unidad de exhibición — no disponible para compra.</p>`;
      } else {
        ctaHTML = `
          <button data-buy-now data-sku="${esc(p.sku)}" ${agotado ? 'disabled' : ''}
             class="btn-sharp flex-1 inline-flex items-center justify-center gap-2 px-6 py-4 text-sm font-mono font-bold text-night transition" style="background:${agotado ? '' : '#C8F02A'};">
            <i class="fa-solid ${agotado ? 'fa-ban' : 'fa-arrow-right'}"></i> ${agotado ? 'Agotado' : 'Comprar ahora'}
          </button>
          <button type="button" data-open-chat data-chat-prompt="María Paula, tengo dudas sobre ${esc(p.nombre)} (${esc(p.sku)})." class="btn-sharp flex-1 inline-flex items-center justify-center gap-2 border px-6 py-4 text-sm font-mono font-bold text-ink transition" style="border-color:rgba(242,241,236,.24)"><i class="fa-regular fa-comments"></i> Consultar asesor</button>`;
      }

      document.getElementById('ficha').innerHTML = `
        <div class="flex items-center gap-2 text-xs font-mono mb-6" style="color:rgba(242,241,236,.5);">
          <a href="racing.html" style="color:rgba(242,241,236,.5);" class="hover:text-ink">← MK Racing</a>
          <span>/</span><span style="color:#E0A868;">${esc((RC.familias.find(f=>f.id===p.familia)||{}).nombre || '')}</span>
        </div>
        <div class="grid lg:grid-cols-2 gap-10">
          <div>
            <div class="aspect-square rounded-bento overflow-hidden border" style="border-color:rgba(242,241,236,.14); background:rgba(242,241,236,.03);">
              <img id="mainImg" src="${esc(p.imagenes.hero)}" alt="${esc(p.nombre)}" class="w-full h-full object-cover cursor-zoom-in" />
            </div>
            <div class="mt-3 grid grid-cols-6 gap-2">${thumbsHTML}</div>
          </div>
          <div>
            ${esVendidoOMostrador ? `<span class="inline-block rounded-full px-3 py-1 text-[10px] font-mono font-bold mb-3" style="background:rgba(242,241,236,.12); color:#F2F1EC;">${p.estado === 'vendido' ? 'Vendido' : 'Unidad de exhibición'}</span>` : ''}
            <h1 class="text-3xl sm:text-4xl font-extrabold font-display tracking-tight">${esc(p.nombre)}</h1>
            <p class="mt-3 text-sm" style="color:rgba(242,241,236,.65);">${esc(p.angulo_venta)}</p>
            ${variantesHTML}
            <p class="mt-5 text-3xl font-bold font-display text-ink">${precio != null ? fmt(precio) : '—'} <span class="text-sm font-mono font-medium" style="color:rgba(242,241,236,.5);">COP</span></p>
            <p class="mt-1 text-xs font-mono" style="color:rgba(242,241,236,.5);">Contra entrega nacional · Paga al recibir</p>
            <div class="mt-5 flex flex-col sm:flex-row gap-3">${ctaHTML}</div>
            <p class="mt-3 text-xs font-mono" style="color:rgba(242,241,236,.45);">+14 años · Garantía ${p.garantia_dias} días de fábrica</p>
            ${claimsHTML}
            ${incluyeHTML}
            <div class="mt-8">
              <p class="text-xs font-mono uppercase tracking-wide mb-1" style="color:rgba(242,241,236,.5);">Especificaciones</p>
              ${specsHTML}
            </div>
          </div>
        </div>
        ${relacionadosHTML}
        ${reviewsHTML(p)}
      `;

      // Galería: swap + lightbox
      document.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('mainImg').src = btn.dataset.src;
          document.querySelectorAll('.thumb').forEach(t => t.classList.remove('thumb-active'));
          btn.classList.add('thumb-active');
        });
      });
      document.getElementById('mainImg').addEventListener('click', () => {
        document.getElementById('lightboxImg').src = document.getElementById('mainImg').src;
        document.getElementById('lightbox').classList.add('is-open');
      });

      // Swatch de variante: re-navega a la ficha del hermano y re-evalua stock,
      // en vez de solo cambiar la imagen — asi el boton de compra siempre
      // refleja el stock real de la variante que se esta viendo.
      document.querySelectorAll('[data-variante-sku]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sku = btn.dataset.varianteSku;
          if (sku === p.sku) return;
          history.replaceState(null, '', `racing-producto?sku=${encodeURIComponent(sku)}`);
          const hermano = RC.productos.find(x => x.sku === sku);
          pintar(hermano);
        });
      });

      inyectarJsonLd(p, precio, !agotado && !esVendidoOMostrador);
      window.MPXAnalytics?.once(`view_${p.sku}`,'product_view',{currency:'COP',value:precio || 0,items:[{sku:p.sku,nombre:p.nombre,precio:precio || 0,qty:1}]});
    }

    document.getElementById('lightboxClose').addEventListener('click', () => document.getElementById('lightbox').classList.remove('is-open'));
    document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') e.currentTarget.classList.remove('is-open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('is-open'); });

    cargar();
  </script>

  <script src="mpx-funnel.js"></script>
  <script src="carrito.js"></script>
  <script src="chat-widget.js"></script>
</body>
</html>
