        <a href="https://wa.me/573123414989" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 btn-sharp px-6 py-3 text-sm font-bold font-mono text-night transition" style="background:#25D366">

  <script>
    // Aviso importante (ver docs de Bold): la redirección NUNCA es la prueba de la venta,
    // solo un mensaje informativo para el cliente. Lo que confirma el pedido es el webhook
    // server-side (api/webhook-bold.js). Esta consulta es "mejor esfuerzo": si falla, no
    // pasa nada — el pedido se procesa igual del lado del servidor.
    const params = new URLSearchParams(location.search);
    const referencia = params.get('bold-order-id');
    const estadoRedireccion = params.get('bold-tx-status');

    const icono = document.getElementById('estadoIcono');
    const titulo = document.getElementById('estadoTitulo');
    const texto = document.getElementById('estadoTexto');

    // Normaliza tanto los estados del webhook (SALE_APPROVED, VOID_APPROVED...)
    // como los del parametro de redireccion (approved, rejected...) a un solo
    // vocabulario interno para pintar la pantalla.
    function normalizarEstado(estado) {
      const e = String(estado || '').toUpperCase();
      if (e === 'SALE_APPROVED' || e === 'APPROVED') return 'APPROVED';
      if (e === 'SALE_REJECTED' || e === 'REJECTED') return 'DECLINED';
      if (e === 'VOID_APPROVED' || e === 'VOID_REJECTED' || e === 'VOIDED') return 'VOIDED';
      if (e === 'PENDING') return 'PENDING';
      return 'DESCONOCIDO';
    }

    function pintar(estado) {
      const mapa = {
        APPROVED: { icon: 'fa-check', color: '#25D366', t: '¡Pago aprobado!', d: 'Tu pedido quedó confirmado. Te contactaremos por WhatsApp para coordinar el envío.' },
        DECLINED: { icon: 'fa-xmark', color: '#f87171', t: 'Pago rechazado', d: 'Tu banco rechazó la transacción. Puedes intentar con otro medio de pago o escribirnos.' },
        PENDING:  { icon: 'fa-clock', color: '#C8F02A', t: 'Pago en proceso', d: 'Estamos esperando la confirmación de tu banco. Te avisaremos por WhatsApp apenas se confirme.' },
        VOIDED:   { icon: 'fa-rotate-left', color: 'rgba(242,241,236,.66)', t: 'Pago anulado', d: 'Esta transacción fue anulada. Si no reconoces esta acción, escríbenos por WhatsApp.' },
        ERROR:    { icon: 'fa-triangle-exclamation', color: '#f87171', t: 'Algo salió mal', d: 'No pudimos procesar el pago. Escríbenos por WhatsApp y te ayudamos.' },
        DESCONOCIDO: { icon: 'fa-circle-info', color: 'rgba(242,241,236,.66)', t: 'No pudimos confirmar el estado', d: 'Si el dinero salió de tu cuenta, escríbenos por WhatsApp con tu número de referencia y lo verificamos.' },
      };
      const info = mapa[estado] || mapa.DESCONOCIDO;
      icono.innerHTML = `<i class="fa-solid ${info.icon}" style="color:${info.color}"></i>`;
      titulo.textContent = info.t;
      texto.textContent = info.d;

      if (estado === 'APPROVED') {
        if (window.gtag) gtag('event', 'purchase_redirect_informativo');
      }
    }

    if (!referencia) {
      pintar('DESCONOCIDO');
    } else {
      // Primero se pinta con lo que dice la redireccion (inmediato), y luego
      // se reemplaza si el webhook ya proceso el pago del lado del servidor
      // (mas confiable, pero puede tardar: Bold advierte hasta 10 minutos).
      pintar(normalizarEstado(estadoRedireccion));
      fetch(`/api/estado-pago?ref=${encodeURIComponent(referencia)}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          if (data.ok && data.encontrado) pintar(normalizarEstado(data.estado));
        })
        .catch(() => { /* nos quedamos con el estado de la redireccion */ });
    }
  </script>
