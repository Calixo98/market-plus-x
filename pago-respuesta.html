<body class="font-sans text-ink antialiased bg-night min-h-screen flex items-center justify-center px-4">

  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WG74VTMW"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div class="bento max-w-md w-full p-8 text-center">
    <div id="estadoIcono" class="w-16 h-16 mx-auto rounded-full bg-card flex items-center justify-center text-3xl">
      <i class="fa-solid fa-spinner fa-spin text-accent"></i>
    </div>
    <h1 id="estadoTitulo" class="mt-5 text-xl font-extrabold">Confirmando tu pago…</h1>
    <p id="estadoTexto" class="mt-3 text-sm text-sec">Esto solo toma un momento.</p>

    <div class="mt-7 flex flex-col gap-3">
      <a href="index.html#inicio" class="inline-flex items-center justify-center gap-2 rounded-full bg-accent px-6 py-3 text-sm font-bold text-white hover:bg-accent-hover transition">
        Volver a la tienda
      </a>
      <a href="https://wa.me/573229320982" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-2 rounded-full bg-wa px-6 py-3 text-sm font-bold text-night hover:bg-wa-dark transition">
        <i class="fa-brands fa-whatsapp"></i> Escríbenos por WhatsApp
      </a>
    </div>

    <p class="mt-5 text-xs text-ter">
      Esta pantalla es solo informativa. La confirmación real de tu pedido llega directamente de Bold;
      si tienes dudas, escríbenos con tu número de referencia.
    </p>
  </div>

  <script>
    // Aviso importante (ver docs de Bold): la redirección NUNCA es la prueba de la venta,
    // solo un mensaje informativo para el cliente. Lo que confirma el pedido es el webhook
    // server-side (api/webhook-bold.js). Esta consulta es "mejor esfuerzo": si falla, no
    // pasa nada — el pedido se procesa igual del lado del servidor.
    const params = new URLSearchParams(location.search);
    const referencia = params.get('bold-order-id');
    const estadoRedireccion = params.get('bold-tx-status');

    const icono = document.getElementById('estadoIcono');
    const titulo = document.getElementById('estadoTitulo');
    const texto = document.getElementById('estadoTexto');

    // Normaliza tanto los estados del webhook (SALE_APPROVED, VOID_APPROVED...)
    // como los del parametro de redireccion (approved, rejected...) a un solo
    // vocabulario interno para pintar la pantalla.
    function normalizarEstado(estado) {
      const e = String(estado || '').toUpperCase();
      if (e === 'SALE_APPROVED' || e === 'APPROVED') return 'APPROVED';
      if (e === 'SALE_REJECTED' || e === 'REJECTED') return 'DECLINED';
      if (e === 'VOID_APPROVED' || e === 'VOID_REJECTED' || e === 'VOIDED') return 'VOIDED';
      if (e === 'PENDING') return 'PENDING';
      return 'DESCONOCIDO';
    }

    function pintar(estado) {
      const mapa = {
        APPROVED: { icon: 'fa-check', color: 'text-wa', t: '¡Pago aprobado!', d: 'Tu pedido quedó confirmado. Te contactaremos por WhatsApp para coordinar el envío.' },
        DECLINED: { icon: 'fa-xmark', color: 'text-red-400', t: 'Pago rechazado', d: 'Tu banco rechazó la transacción. Puedes intentar con otro medio de pago o escribirnos.' },
        PENDING:  { icon: 'fa-clock', color: 'text-accent', t: 'Pago en proceso', d: 'Estamos esperando la confirmación de tu banco. Te avisaremos por WhatsApp apenas se confirme.' },
        VOIDED:   { icon: 'fa-rotate-left', color: 'text-sec', t: 'Pago anulado', d: 'Esta transacción fue anulada. Si no reconoces esta acción, escríbenos por WhatsApp.' },
        ERROR:    { icon: 'fa-triangle-exclamation', color: 'text-red-400', t: 'Algo salió mal', d: 'No pudimos procesar el pago. Escríbenos por WhatsApp y te ayudamos.' },
        DESCONOCIDO: { icon: 'fa-circle-info', color: 'text-sec', t: 'No pudimos confirmar el estado', d: 'Si el dinero salió de tu cuenta, escríbenos por WhatsApp con tu número de referencia y lo verificamos.' },
      };
      const info = mapa[estado] || mapa.DESCONOCIDO;
      icono.innerHTML = `<i class="fa-solid ${info.icon} ${info.color}"></i>`;
      titulo.textContent = info.t;
      texto.textContent = info.d;

      if (estado === 'APPROVED') {
        if (window.gtag) gtag('event', 'purchase_redirect_informativo');
      }
    }

    if (!referencia) {
      pintar('DESCONOCIDO');
    } else {
      // Primero se pinta con lo que dice la redireccion (inmediato), y luego
      // se reemplaza si el webhook ya proceso el pago del lado del servidor
      // (mas confiable, pero puede tardar: Bold advierte hasta 10 minutos).
      pintar(normalizarEstado(estadoRedireccion));
      fetch(`/api/estado-pago?ref=${encodeURIComponent(referencia)}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          if (data.ok && data.encontrado) pintar(normalizarEstado(data.estado));
        })
        .catch(() => { /* nos quedamos con el estado de la redireccion */ });
    }
  </script>
