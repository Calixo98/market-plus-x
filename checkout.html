        },

<body class="font-sans text-ink antialiased bg-night">

  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WG74VTMW"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- Atmósfera de fondo (gama = carrito, verde neón) -->
  <div class="mpx-ambient" aria-hidden="true"><div class="mpx-grain"></div></div>

  <header class="sticky top-0 z-50 bg-night/90 backdrop-blur-md border-b" style="border-color:rgba(242,241,236,.14)">
    <nav class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html#inicio" class="flex items-center gap-3">
          <img src="assets/logo-wordmark.png" alt="Market Plus X" class="h-8 w-auto" />
        </a>
        <span class="mpx-gama-badge" aria-hidden="true"></span>
        <span class="inline-flex items-center gap-2 text-sm font-semibold font-mono" style="color:rgba(242,241,236,.66)">
          <i class="fa-solid fa-lock" style="color:#C8F02A"></i> Pago seguro
        </span>
      </div>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight font-display">Finalizar compra</h1>

    <div id="checkoutVacio" class="hidden mt-8 bento p-8 text-center">
      <p style="color:rgba(242,241,236,.50)">Tu carrito está vacío.</p>
      <a href="index.html#modelos" class="mt-4 inline-flex items-center gap-2 btn-sharp px-6 py-3 text-sm font-bold font-mono text-night transition" style="background:#C8F02A">
        Ver modelos <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>

    <div id="checkoutContenido" class="mt-8 grid lg:grid-cols-5 gap-8">
      <!-- Datos del cliente -->
      <div class="lg:col-span-3 bento p-6 sm:p-7">
        <h2 class="text-lg font-bold font-display">Tus datos</h2>
        <form id="formCheckout" class="mt-5 space-y-4" novalidate>
          <div>
            <label for="nombre" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" required aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Como aparece en tu documento" />
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label for="email" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Email</label>
              <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="tucorreo@ejemplo.com" />
            </div>
            <div>
              <label for="telefono" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Teléfono / WhatsApp</label>
              <input type="tel" id="telefono" name="telefono" autocomplete="tel" inputmode="tel" required aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="300 123 4567" />
            </div>
          </div>
          <div>
            <label for="direccion" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Dirección de envío</label>
            <input type="text" id="direccion" name="direccion" autocomplete="street-address" required aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Calle, número, barrio" />
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label for="ciudad" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Ciudad</label>
              <select id="ciudad" name="ciudad" autocomplete="address-level2" required aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm">
                <option value="">Selecciona tu ciudad</option>
                <option value="Bogotá D.C.">Bogotá D.C.</option>
                <option value="Medellín">Medellín</option>
                <option value="Cali">Cali</option>
                <option value="Barranquilla">Barranquilla</option>
                <option value="Cartagena">Cartagena</option>
                <option value="Bucaramanga">Bucaramanga</option>
                <option value="Pereira">Pereira</option>
                <option value="Manizales">Manizales</option>
                <option value="Cúcuta">Cúcuta</option>
                <option value="__otra__">Otra ciudad…</option>
              </select>
            </div>
            <div id="ciudadOtraWrap" class="hidden">
              <label for="ciudadOtra" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">¿Cuál?</label>
              <input type="text" id="ciudadOtra" name="ciudadOtra" autocomplete="address-level2" aria-describedby="formError" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Nombre de tu ciudad" />
            </div>
            <div>
              <label for="departamento" class="block text-xs font-semibold uppercase tracking-wide font-mono mb-1.5" style="color:rgba(242,241,236,.50)">Departamento</label>
              <input type="text" id="departamento" name="departamento" autocomplete="address-level1" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Opcional" />
            </div>
          </div>
          <p id="formError" role="alert" aria-live="assertive" class="hidden text-sm text-red-400"></p>
        </form>
      </div>

      <!-- Resumen -->
      <div class="lg:col-span-2">
        <div class="bento p-6 sm:p-7 sticky top-24">
          <h2 class="text-lg font-bold font-display">Resumen del pedido</h2>
          <div id="resumenItems" class="mt-4 space-y-3"></div>
          <div class="mt-5 pt-4 border-t" style="border-color:rgba(242,241,236,.14); space-y-2 text-sm">
            <div class="flex justify-between" style="color:rgba(242,241,236,.66)"><span>Subtotal</span><span id="resumenSubtotal">$0</span></div>
            <div class="flex justify-between" style="color:rgba(242,241,236,.66)"><span>Envío</span><span id="resumenEnvio">Selecciona tu ciudad</span></div>
            <div class="flex justify-between text-lg font-extrabold pt-2 border-t font-display" style="border-color:rgba(242,241,236,.14)"><span>Total</span><span id="resumenTotal">$0</span></div>
          </div>
          <button id="btnPagar" type="submit" form="formCheckout" class="mt-6 w-full inline-flex items-center justify-center gap-2 btn-sharp px-6 py-4 text-base font-bold font-mono text-night transition disabled:cursor-not-allowed" style="background:#C8F02A">
            <i class="fa-solid fa-lock"></i> Pagar con Bold
          </button>
          <p class="mt-3 text-xs text-center font-mono" style="color:rgba(242,241,236,.50)">Tarjeta, PSE, Nequi o Bancolombia. Tienes 15 minutos para completar el pago.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fmt = n => '$' + n.toLocaleString('es-CO');

    let PRODUCTOS = [];
    let ZONAS = [];

    function zonaDe(ciudad) {
      const normalizada = String(ciudad || '').trim().toLowerCase();
      return ZONAS.find(z => z.ciudades.some(c => c.toLowerCase() === normalizada))
        || ZONAS.find(z => z.id === 'resto');
    }

    function ciudadSeleccionada() {
      const sel = document.getElementById('ciudad').value;
      if (sel === '__otra__') return document.getElementById('ciudadOtra').value.trim();
      return sel;
    }

    async function renderResumen() {
      const items = window.MPXCarrito.leer();
      const cont = document.getElementById('resumenItems');
      const vacio = document.getElementById('checkoutVacio');
      const contenido = document.getElementById('checkoutContenido');

      if (items.length === 0) {
        vacio.classList.remove('hidden');
        contenido.classList.add('hidden');
        return { subtotal: 0, envio: 0, total: 0 };
      }
      vacio.classList.add('hidden');
      contenido.classList.remove('hidden');

      let subtotal = 0;
      let todoEnvioGratis = true;
      cont.innerHTML = items.map(item => {
        const p = PRODUCTOS.find(x => x.sku === item.sku);
        if (!p) return '';
        subtotal += p.precio * item.qty;
        if (!p.envioGratis) todoEnvioGratis = false;
        return `
          <div class="flex justify-between gap-3 text-sm">
            <span style="color:rgba(242,241,236,.66)">${item.qty}× ${p.nombre}</span>
            <span class="font-semibold whitespace-nowrap">${fmt(p.precio * item.qty)}</span>
          </div>`;
      }).join('');

      document.getElementById('resumenSubtotal').textContent = fmt(subtotal);

      const ciudad = ciudadSeleccionada();
      let envio = 0;
      if (!ciudad) {
        document.getElementById('resumenEnvio').textContent = 'Selecciona tu ciudad';
      } else if (todoEnvioGratis) {
        document.getElementById('resumenEnvio').textContent = 'Gratis';
      } else {
        const zona = zonaDe(ciudad);
        envio = zona.tarifa;
        document.getElementById('resumenEnvio').textContent = fmt(envio) + ' · ' + zona.nombre;
      }

      const total = subtotal + envio;
      document.getElementById('resumenTotal').textContent = fmt(total);
      return { subtotal, envio, total };
    }

    document.getElementById('ciudad').addEventListener('change', e => {
      document.getElementById('ciudadOtraWrap').classList.toggle('hidden', e.target.value !== '__otra__');
      renderResumen();
    });
    document.getElementById('ciudadOtra').addEventListener('input', renderResumen);

    // Limpia el aria-invalid de un intento anterior antes de validar de nuevo.
    function limpiarInvalidos() {
      ['nombre', 'email', 'telefono', 'direccion', 'ciudad', 'ciudadOtra'].forEach(id => {
        document.getElementById(id).removeAttribute('aria-invalid');
      });
    }

    // Muestra el error, lo asocia al campo culpable, y le mueve el foco — así
    // el usuario SIEMPRE ve o siente que algo paso (no solo un texto que puede
    // quedar fuera de la pantalla en movil), y un lector de pantalla lo anuncia
    // de inmediato por el aria-live del propio elemento.
    function mostrarError(msg, campoId) {
      const el = document.getElementById('formError');
      el.textContent = msg;
      el.classList.remove('hidden');
      if (campoId) {
        const campo = document.getElementById(campoId);
        campo.setAttribute('aria-invalid', 'true');
        campo.focus();
        campo.scrollIntoView({ block: 'center', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
    }
    function ocultarError() {
      document.getElementById('formError').classList.add('hidden');
      limpiarInvalidos();
    }

    document.getElementById('formCheckout').addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarError();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const direccion = document.getElementById('direccion').value.trim();
      const departamento = document.getElementById('departamento').value.trim();
      const ciudad = ciudadSeleccionada();

      if (nombre.length < 3) return mostrarError('Escribe tu nombre completo.', 'nombre');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return mostrarError('Escribe un email válido.', 'email');
      if (telefono.replace(/\D/g, '').length < 7) return mostrarError('Escribe un teléfono válido.', 'telefono');
      if (direccion.length < 5) return mostrarError('Escribe tu dirección de envío.', 'direccion');
      if (!ciudad) return mostrarError('Selecciona o escribe tu ciudad.', document.getElementById('ciudad').value === '__otra__' ? 'ciudadOtra' : 'ciudad');

      const items = window.MPXCarrito.leer();
      if (items.length === 0) return mostrarError('Tu carrito está vacío.');

      const btn = document.getElementById('btnPagar');
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando…';

      try {
        const resp = await fetch('api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: items.map(i => ({ sku: i.sku, qty: i.qty })),
            ciudad,
            cliente: { nombre, email, telefono, direccion, departamento },
          }),
        });
        let data;
        try {
          data = await resp.json();
        } catch {
          throw new Error('No pudimos conectar con el servidor de pagos. Intenta de nuevo en un momento.');
        }
        if (!resp.ok || !data.ok) throw new Error(data.error || 'No se pudo iniciar el pago');

        if (window.gtag) gtag('event', 'begin_checkout', { value: data.resumen.total, currency: 'COP' });
        if (window.fbq) fbq('track', 'InitiateCheckout', { value: data.resumen.total, currency: 'COP' });
        if (window.ttq) ttq.track('InitiateCheckout');

        // El servidor ya calculo el total real y lo mando a Bold: solo queda
        // redirigir. No hay nada que firmar ni construir en el navegador.
        location.href = data.paymentUrl;
      } catch (err) {
        mostrarError(err.message || 'Ocurrió un error. Intenta de nuevo.');
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        btn.innerHTML = '<i class="fa-solid fa-lock"></i> Pagar con Bold';
      }
    });

    Promise.all([
      window.MPXCarrito ? window.MPXCarrito.cargarProductos() : fetch('productos.json').then(r => r.json()).then(d => d.productos),
      fetch('envios.json').then(r => r.json()),
    ]).then(([productos, envios]) => {
      PRODUCTOS = productos;
      ZONAS = envios.zonas;
      renderResumen();
    });
  </script>

  <script src="carrito.js"></script>
</body>
</html>
