<body class="font-sans text-ink antialiased bg-night">

  <header class="sticky top-0 z-50 bg-night/90 backdrop-blur-md border-b border-hairline">

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Finalizar compra</h1>

    <div id="checkoutVacio" class="hidden mt-8 bento p-8 text-center">
      <p class="text-sec">Tu carrito está vacío.</p>
      <a href="index.html#modelos" class="mt-4 inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-sm font-bold text-white hover:bg-accent-hover transition">
        Ver modelos <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>

    <div id="checkoutContenido" class="mt-8 grid lg:grid-cols-5 gap-8">
      <!-- Datos del cliente -->
      <div class="lg:col-span-3 bento p-6 sm:p-7">
        <h2 class="text-lg font-bold">Tus datos</h2>
        <form id="formCheckout" class="mt-5 space-y-4" novalidate>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Nombre completo</label>
            <input type="text" id="nombre" required class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Como aparece en tu documento" />
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Email</label>
              <input type="email" id="email" required class="w-full rounded-xl px-4 py-3 text-sm" placeholder="tucorreo@ejemplo.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Teléfono / WhatsApp</label>
              <input type="tel" id="telefono" required class="w-full rounded-xl px-4 py-3 text-sm" placeholder="300 123 4567" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Dirección de envío</label>
            <input type="text" id="direccion" required class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Calle, número, barrio" />
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Ciudad</label>
              <select id="ciudad" required class="w-full rounded-xl px-4 py-3 text-sm">
                <option value="">Selecciona tu ciudad</option>
                <option value="Bogotá D.C.">Bogotá D.C.</option>
                <option value="Medellín">Medellín</option>
                <option value="Cali">Cali</option>
                <option value="Barranquilla">Barranquilla</option>
                <option value="Cartagena">Cartagena</option>
                <option value="Bucaramanga">Bucaramanga</option>
                <option value="Pereira">Pereira</option>
                <option value="Manizales">Manizales</option>
                <option value="Cúcuta">Cúcuta</option>
                <option value="__otra__">Otra ciudad…</option>
              </select>
            </div>
            <div id="ciudadOtraWrap" class="hidden">
              <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">¿Cuál?</label>
              <input type="text" id="ciudadOtra" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Nombre de tu ciudad" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wide text-ter mb-1.5">Departamento</label>
              <input type="text" id="departamento" class="w-full rounded-xl px-4 py-3 text-sm" placeholder="Opcional" />
            </div>
          </div>
          <p id="formError" class="hidden text-sm text-red-400"></p>
        </form>
      </div>

      <!-- Resumen -->
      <div class="lg:col-span-2">
        <div class="bento p-6 sm:p-7 sticky top-24">
          <h2 class="text-lg font-bold">Resumen del pedido</h2>
          <div id="resumenItems" class="mt-4 space-y-3"></div>
          <div class="mt-5 pt-4 border-t border-hairline space-y-2 text-sm">
            <div class="flex justify-between text-sec"><span>Subtotal</span><span id="resumenSubtotal">$0</span></div>
            <div class="flex justify-between text-sec"><span>Envío</span><span id="resumenEnvio">Selecciona tu ciudad</span></div>
            <div class="flex justify-between text-lg font-extrabold pt-2 border-t border-hairline"><span>Total</span><span id="resumenTotal">$0</span></div>
          </div>
          <button id="btnPagar" class="mt-6 w-full inline-flex items-center justify-center gap-2 rounded-full bg-accent px-6 py-4 text-base font-bold text-white hover:bg-accent-hover transition disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-lock"></i> Pagar con Wompi
          </button>
          <p class="mt-3 text-xs text-ter text-center">Tarjeta, PSE, Nequi o Bancolombia. Tienes 15 minutos para completar el pago.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Form oculto que se envia a Wompi (Web Checkout, redireccion GET) -->
  <form id="formWompi" method="GET" action="https://checkout.wompi.co/p/" class="hidden"></form>

  <script>
    const fmt = n => '$' + n.toLocaleString('es-CO');

    let PRODUCTOS = [];
    let ZONAS = [];

    function zonaDe(ciudad) {
      const normalizada = String(ciudad || '').trim().toLowerCase();
      return ZONAS.find(z => z.ciudades.some(c => c.toLowerCase() === normalizada))
        || ZONAS.find(z => z.id === 'resto');
    }

    function ciudadSeleccionada() {
      const sel = document.getElementById('ciudad').value;
      if (sel === '__otra__') return document.getElementById('ciudadOtra').value.trim();
      return sel;
    }

    async function renderResumen() {
      const items = window.MPXCarrito.leer();
      const cont = document.getElementById('resumenItems');
      const vacio = document.getElementById('checkoutVacio');
      const contenido = document.getElementById('checkoutContenido');

      if (items.length === 0) {
        vacio.classList.remove('hidden');
        contenido.classList.add('hidden');
        return { subtotal: 0, envio: 0, total: 0 };
      }
      vacio.classList.add('hidden');
      contenido.classList.remove('hidden');

      let subtotal = 0;
      let todoEnvioGratis = true;
      cont.innerHTML = items.map(item => {
        const p = PRODUCTOS.find(x => x.sku === item.sku);
        if (!p) return '';
        subtotal += p.precio * item.qty;
        if (!p.envioGratis) todoEnvioGratis = false;
        return `
          <div class="flex justify-between gap-3 text-sm">
            <span class="text-sec">${item.qty}× ${p.nombre}</span>
            <span class="font-semibold whitespace-nowrap">${fmt(p.precio * item.qty)}</span>
          </div>`;
      }).join('');

      document.getElementById('resumenSubtotal').textContent = fmt(subtotal);

      const ciudad = ciudadSeleccionada();
      let envio = 0;
      if (!ciudad) {
        document.getElementById('resumenEnvio').textContent = 'Selecciona tu ciudad';
      } else if (todoEnvioGratis) {
        document.getElementById('resumenEnvio').textContent = 'Gratis';
      } else {
        const zona = zonaDe(ciudad);
        envio = zona.tarifa;
        document.getElementById('resumenEnvio').textContent = fmt(envio) + ' · ' + zona.nombre;
      }

      const total = subtotal + envio;
      document.getElementById('resumenTotal').textContent = fmt(total);
      return { subtotal, envio, total };
    }

    document.getElementById('ciudad').addEventListener('change', e => {
      document.getElementById('ciudadOtraWrap').classList.toggle('hidden', e.target.value !== '__otra__');
      renderResumen();
    });
    document.getElementById('ciudadOtra').addEventListener('input', renderResumen);

    function mostrarError(msg) {
      const el = document.getElementById('formError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function ocultarError() {
      document.getElementById('formError').classList.add('hidden');
    }

    document.getElementById('btnPagar').addEventListener('click', async () => {
      ocultarError();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const direccion = document.getElementById('direccion').value.trim();
      const departamento = document.getElementById('departamento').value.trim();
      const ciudad = ciudadSeleccionada();

      if (nombre.length < 3) return mostrarError('Escribe tu nombre completo.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return mostrarError('Escribe un email válido.');
      if (telefono.replace(/\D/g, '').length < 7) return mostrarError('Escribe un teléfono válido.');
      if (direccion.length < 5) return mostrarError('Escribe tu dirección de envío.');
      if (!ciudad) return mostrarError('Selecciona o escribe tu ciudad.');

      const items = window.MPXCarrito.leer();
      if (items.length === 0) return mostrarError('Tu carrito está vacío.');

      const btn = document.getElementById('btnPagar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando…';

      try {
        const resp = await fetch('api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: items.map(i => ({ sku: i.sku, qty: i.qty })),
            ciudad,
            cliente: { nombre, email, telefono, direccion, departamento },
          }),
        });
        let data;
        try {
          data = await resp.json();
        } catch {
          throw new Error('No pudimos conectar con el servidor de pagos. Intenta de nuevo en un momento.');
        }
        if (!resp.ok || !data.ok) throw new Error(data.error || 'No se pudo iniciar el pago');

        if (window.gtag) gtag('event', 'begin_checkout', { value: data.resumen.total, currency: 'COP' });
        if (window.fbq) fbq('track', 'InitiateCheckout', { value: data.resumen.total, currency: 'COP' });
        if (window.ttq) ttq.track('InitiateCheckout');

        const form = document.getElementById('formWompi');
        form.innerHTML = '';
        const campos = {
          'public-key': data.publicKey,
          currency: data.currency,
          'amount-in-cents': data.amountInCents,
          reference: data.reference,
          'signature:integrity': data.signature,
          'expiration-time': data.expirationTime,
          'redirect-url': data.redirectUrl,
          'customer-data:email': data.customer.email,
          'customer-data:full-name': data.customer.fullName,
          'customer-data:phone-number': data.customer.phoneNumber,
          'shipping-address:address-line-1': data.shipping.addressLine1,
          'shipping-address:city': data.shipping.city,
          'shipping-address:region': data.shipping.region,
          'shipping-address:phone-number': data.shipping.phoneNumber,
        };
        Object.entries(campos).forEach(([name, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        });
        form.submit();
      } catch (err) {
        mostrarError(err.message || 'Ocurrió un error. Intenta de nuevo.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock"></i> Pagar con Wompi';
      }
    });

    Promise.all([
      window.MPXCarrito ? window.MPXCarrito.cargarProductos() : fetch('productos.json').then(r => r.json()).then(d => d.productos),
      fetch('envios.json').then(r => r.json()),
    ]).then(([productos, envios]) => {
      PRODUCTOS = productos;
      ZONAS = envios.zonas;
      renderResumen();
    });
  </script>

  <script src="carrito.js"></script>
</body>
